name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Když přijde nový push během nasazování, počkáme — přerušit nasazení
# webu uprostřed by ho nechalo v půli.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the signup form is wired up
        run: |
          # Nasadit stránku s nevyplněným formulářem znamená sbírat adresy
          # do prázdna. Radši ať to spadne tady.
          if grep -q "DOPLN_FORM_ID" site/index.html; then
            echo "::error::V site/index.html je pořád DOPLN_FORM_ID — doplň ID formuláře."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
