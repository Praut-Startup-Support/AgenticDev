name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Strom repa slibuje cesty; ověř, že existují ────────────────────
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make verify
        run: make verify

  # ── Shell a Python se musí parsovat ────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Parse every shell script
        run: |
          fail=0
          while IFS= read -r f; do
            head -c 100 "$f" | grep -qE '^#!.*(bash|/sh)' || continue
            bash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(find . -path ./.git -prune -o -type f -print)
          exit $fail

      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          find . -path ./.git -prune -o -name '*.sh' -print \
            | xargs -r shellcheck -S warning || true

      - name: Parse Python
        run: python3 -c "import ast,sys;[ast.parse(open(f).read()) for f in sys.argv[1:]]" control-plane/app/*.py pod/harness/*.py

      # Panel je jeden HTML soubor s vloženým skriptem. Jedna chyba v něm
      # neshodí obrazovku, ale celý skript — tedy i přihlášení. Přesně tak
      # tam roky ležel `const esc` vedle `function esc`: SyntaxError, mrtvý
      # panel, a smoke test to nechytil, protože ten testuje API curlem.
      - name: Parse embedded JavaScript
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          fail = 0
          for f in sorted(pathlib.Path("control-plane/app").glob("*.html")):
              for i, s in enumerate(re.findall(r"<script>(.*?)</script>", f.read_text(), re.S)):
                  p = pathlib.Path(f"/tmp/{f.stem}-{i}.js")
                  p.write_text(s)
                  r = subprocess.run(["node", "--check", str(p)],
                                     capture_output=True, text=True)
                  if r.returncode:
                      print(f"::error file={f}::skript se neparsuje\n{r.stderr}")
                      fail = 1
                  else:
                      print(f"  ok {f} (blok {i})")
          sys.exit(fail)
          PY

  # ── Git automatizace je to, co obsluhuje lidi bez znalosti gitu ────
  # Běží na dočasném repozitáři v /tmp, nic mimo něj nesahá. Bez téhle
  # úlohy by se regrese v `agenticdev-git` poznala až tím, že někomu
  # zmizí rozdělaná práce nebo uvázne v rozděleném rebase.
  git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test-git
        run: make test-git

  # ── Build musí být deterministický ─────────────────────────────────
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Build twice, compare
        run: |
          make dist
          a=$(cut -d' ' -f1 dist/agenticdev-install-vps.sh.sha256)
          make clean && make dist
          b=$(cut -d' ' -f1 dist/agenticdev-install-vps.sh.sha256)
          echo "build 1: $a"
          echo "build 2: $b"
          if [ "$a" != "$b" ]; then
            echo "::error::build is not reproducible"
            exit 1
          fi

      - name: Artifact self-check
        run: bash dist/agenticdev-install-vps.sh --check

  # ── Skutečná instalace na čistém systému ───────────────────────────
  # Tohle je ta úloha, která by chytila chyby jako chybějící INSTALL_LOCK
  # nebo špatná práva na datech Forgeja. Bez ní se na ně přijde až v provozu.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Build artifact
        run: make dist

      - name: Compose config must interpolate
        run: |
          # Vyrob minimální .env se všemi povinnými proměnnými a nech
          # docker compose ověřit, že se soubor přeloží. Chybějící proměnná
          # (jako dřív SMTP_FROM u Caddy) tady spadne.
          cat > /tmp/test.env <<'ENV'
          AGENTICDEV_INSTANCE_ID=00000000-0000-0000-0000-000000000000
          AGENTICDEV_MODE=public
          AGENTICDEV_DOMAIN=test.example.ts.net
          VPS_HOST=127.0.0.1
          TZ=Europe/Prague
          POSTGRES_PASSWORD=testtesttesttest
          MINIO_ROOT_PASSWORD=testtesttesttest
          JWT_SECRET=testtesttesttest
          WO_SIGNING_KEY_B64=dGVzdA==
          WO_VERIFY_KEY_B64=dGVzdA==
          JOIN_TOKEN=testtesttesttest
          DASHBOARD_TOKEN=testtesttesttest
          FORGEJO_ADMIN_USER=admin
          FORGEJO_ADMIN_EMAIL=admin@example.com
          FORGEJO_ADMIN_PASSWORD=testtesttesttest
          FORGEJO_SECRET_KEY=testtesttesttest
          FORGEJO_ROOT_URL=https://test.example.ts.net/git/
          FORGEJO_TOKEN=
          FORGEJO_HOOK_SECRET=testtesttesttest
          RUNNER_SECRET=0123456789abcdef0123456789abcdef01234567
          SMTP_HOST=
          SMTP_PORT=587
          SMTP_USER=
          SMTP_PASSWORD=
          SMTP_FROM=platform@example.com
          MINIO_TAG=RELEASE.2025-04-22T22-12-26Z
          ENV
          # Profily se ověřují všechny, které umí nasazení zapnout. Pozor:
          # `config` interpoluje i služby mimo aktivní profil, takže tady
          # spadne i chybějící proměnná runneru.
          docker compose -f vps/docker-compose.yml --env-file /tmp/test.env \
            --profile gate --profile public config > /dev/null
          docker compose -f vps/docker-compose.yml --env-file /tmp/test.env \
            --profile gate config > /dev/null
          echo "✓ compose se přeloží se všemi profily"

      - name: Caddyfile must parse
        run: |
          # Caddyfile se dřív rozbil na `email` bez argumentu. Necháme
          # samotného Caddyho, ať řekne, jestli je syntakticky v pořádku.
          docker run --rm \
            -e AGENTICDEV_DOMAIN=test.example.ts.net \
            -e SMTP_FROM=platform@example.com \
            -v "$PWD/vps/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
