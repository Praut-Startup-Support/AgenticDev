# ═══════════════════════════════════════════════════════════════
#  AgenticDev — VPS stack (F0 + F2)
#
#  Vnitřní služby se publikují na BIND_ADDR. NIKDY na 0.0.0.0:
#    režim tailnet   BIND_ADDR = tailnet IP    → vidí to jen tailnet
#    režim domain    BIND_ADDR = 127.0.0.1     → z venku jen přes Caddy
#  Default je VPS_HOST, aby starší .env fungoval bez úpravy.
#
#  Kdo tu dosadí veřejnou adresu, vystaví Postgres a MinIO na internet.
#  Nasazení: docker compose --env-file /srv/agenticdev/config/.env up -d
# ═══════════════════════════════════════════════════════════════
name: agenticdev

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:

  # ─── Reverse proxy ───────────────────────────────────────────
  caddy:
    <<: [*restart, *logging]
    image: caddy:${CADDY_TAG:-2-alpine}
    profiles: ["public"]          # bez domény se Caddy nestartuje
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/agenticdev/data/caddy:/data
      # Bez tohohle socketu neumí Caddy vyzvednout TLS certifikát pro
      # .ts.net doménu a spadne zpátky na Let's Encrypt → NXDOMAIN.
      # V režimu domain (bez Tailscale) socket neexistuje; instalátor ten
      # adresář založí prázdný, mount je pak neškodný a Caddyfile v tom
      # režimu certifikát bere z ACME.
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    environment:
      AGENTICDEV_DOMAIN: ${AGENTICDEV_DOMAIN}
      # Caddyfile má `email {$SMTP_FROM}` — když se sem proměnná nepředá,
      # Caddy se ani nenastartuje (wrong argument count).
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      forgejo:   { condition: service_started }
      control-plane: { condition: service_healthy }

  # ─── Ledger ──────────────────────────────────────────────────
  postgres:
    <<: [*restart, *logging]
    image: pgvector/pgvector:${POSTGRES_TAG:-pg16}
    # POZOR: bind jen na BIND_ADDR, nikdy 0.0.0.0. Tady je databáze —
    # jedna špatná adresa a je na internetu.
    ports:
      - "${BIND_ADDR:-${VPS_HOST}}:5432:5432"
    environment:
      POSTGRES_USER: agenticdev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?chybi POSTGRES_PASSWORD}
      POSTGRES_DB: agenticdev
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - /srv/agenticdev/data/postgres:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenticdev -d agenticdev"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Git + PR + Actions ──────────────────────────────────────
  forgejo:
    <<: [*restart, *logging]
    image: codeberg.org/forgejo/forgejo:${FORGEJO_TAG:-11}
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: agenticdev
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}
      FORGEJO__server__DOMAIN: ${AGENTICDEV_DOMAIN}
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:-https://${AGENTICDEV_DOMAIN}/git/}
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__server__SSH_DOMAIN: ${VPS_HOST}
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      # BEZ TOHOTO nabíhá Forgejo do instalačního průvodce a všechny
      # `forgejo admin ...` příkazy selžou na MustInstalled().
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY:?chybi FORGEJO_SECRET_KEY}
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtp+starttls
      FORGEJO__mailer__SMTP_ADDR: ${SMTP_HOST}
      FORGEJO__mailer__SMTP_PORT: ${SMTP_PORT:-587}
      FORGEJO__mailer__USER: ${SMTP_USER}
      FORGEJO__mailer__PASSWD: ${SMTP_PASSWORD}
      FORGEJO__mailer__FROM: ${SMTP_FROM}
      FORGEJO__actions__ENABLED: "true"
      TZ: ${TZ:-Europe/Prague}
    ports:
      - "${BIND_ADDR:-${VPS_HOST}}:2222:22"
      - "${BIND_ADDR:-${VPS_HOST}}:3000:3000"    # web jen na tailnetu (záloha, když neběží Caddy)
    volumes:
      - /srv/agenticdev/data/forgejo:/data
    depends_on:
      postgres: { condition: service_healthy }

  # ─── Brána před mergem ───────────────────────────────────────
  # Runner pouští workflow z repozitářů projektů. Smysl je v tom, že to
  # NENÍ pod agenta: testy ověřuje něco jiného než ten, kdo je napsal
  # (ADR-0006).
  #
  # POZOR: runner potřebuje Docker socket, aby uměl spouštět joby v
  # kontejnerech. Kdo umí mluvit s tímhle socketem, je na tomhle stroji
  # rovnocenný rootovi. Běží to vedle databáze a podpisového klíče a je to
  # vědomý kompromis, ne nedopatření.
  runner:
    <<: [*restart, *logging]
    image: code.forgejo.org/forgejo/runner:${RUNNER_TAG:-6}
    profiles: ["gate"]          # bez registrace nemá co dělat
    user: root
    command: >-
      sh -c "forgejo-runner create-runner-file --instance $${FORGEJO_INSTANCE}
               --secret $${RUNNER_SECRET} --connect || true;
             forgejo-runner daemon"
    environment:
      FORGEJO_INSTANCE: http://forgejo:3000
      RUNNER_SECRET: ${RUNNER_SECRET:?chybi RUNNER_SECRET}
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - /srv/agenticdev/data/runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      forgejo: { condition: service_started }

  # ─── Artefakty, transkripty, kontext bundly ──────────────────
  minio:
    <<: [*restart, *logging]
    image: minio/minio:${MINIO_TAG}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agenticdev
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?chybi MINIO_ROOT_PASSWORD}
    ports:
      - "${BIND_ADDR:-${VPS_HOST}}:9000:9000"
      - "${BIND_ADDR:-${VPS_HOST}}:9001:9001"
    volumes:
      - /srv/agenticdev/data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── Řídicí vrstva ───────────────────────────────────────────
  control-plane:
    <<: [*restart, *logging]
    build: ../control-plane
    image: agenticdev/control-plane:dev
    environment:
      DATABASE_URL: postgresql://agenticdev:${POSTGRES_PASSWORD}@postgres:5432/agenticdev
      JWT_SECRET: ${JWT_SECRET:?chybi JWT_SECRET}
      WO_SIGNING_KEY_B64: ${WO_SIGNING_KEY_B64:?chybi WO_SIGNING_KEY_B64}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: agenticdev
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      GIT_BASE: ssh://git@${VPS_HOST}:2222
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-5.5}
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-api.openai.com,registry.npmjs.org,pypi.org}
      LOCAL_MODEL: ${LOCAL_MODEL:-local/qwen2.5-coder:32b}
      WORKSPACE_ROOT: /workspace-templates
      JOIN_TOKEN: ${JOIN_TOKEN:?chybi JOIN_TOKEN}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?chybi DASHBOARD_TOKEN}
      FORGEJO_URL: http://forgejo:3000
      FORGEJO_TOKEN: ${FORGEJO_TOKEN:-}
      # Podpis webhooku z Forgeja. Bez něj control plane webhook odmítne —
      # nepodepsaný požadavek by dovolil označovat úkoly za hotové komukoli.
      FORGEJO_HOOK_SECRET: ${FORGEJO_HOOK_SECRET:-}
      # Adresa, na kterou Forgejo webhook posílá. Uvnitř sítě, ne přes Caddy.
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:8080
      GIT_SSH_BASE: ssh://git@${VPS_HOST}:2222
      HARNESS_IMAGE: ${HARNESS_IMAGE:-agenticdev/harness:dev}
      AGENTICDEV_DOMAIN: ${AGENTICDEV_DOMAIN:-}
      AGENTICDEV_INSTANCE_ID: ${AGENTICDEV_INSTANCE_ID:-}
      # tailscale | domain — určuje, co se lidem posílá za způsob přihlášení
      AGENTICDEV_CONNECT: ${AGENTICDEV_CONNECT:-tailscale}
      # Správce instance jako `principal`, ať má auditní stopa u panelových
      # zápisů koho uvést. Bez toho je actor prázdný.
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      WO_VERIFY_KEY_B64: ${WO_VERIFY_KEY_B64:-}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      LEASE_HOURS: ${LEASE_HOURS:-4}
      # ─── veřejná registrace (Tailscale Funnel → /join) ───────────
      ENROLL_PASSWORD: ${ENROLL_PASSWORD:-}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_API_KEY: ${TS_API_KEY:-}
      TS_TAILNET: ${TS_TAILNET:--}
      AGENTICDEV_OUT: /out
      TZ: ${TZ:-Europe/Prague}
    ports:
      - "${BIND_ADDR:-${VPS_HOST}}:8080:8080"
    volumes:
      - /srv/agenticdev/data/directors:/directors
      - /srv/agenticdev/src:/repo:ro
      - /srv/agenticdev/src/workspace:/workspace-templates:ro
      # instalátor pro tým — vydává se přes /join/installer proti heslu
      - /srv/agenticdev/out:/out:ro
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

# ─── F4: observabilita — odkomentuj, až budeš na fázi F4 ───────
#  loki:       { image: grafana/loki:3.4.2,      ... }
#  prometheus: { image: prom/prometheus:v3.2.1,  ... }
#  tempo:      { image: grafana/tempo:2.7.1,     ... }
#  grafana:    { image: grafana/grafana:11.5.2,  ... }
